<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zresetuj hasło | Ranking Chwały</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d121d;
      color: #f1f5f9;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1a2234;
      border: 1.5px solid rgba(245, 158, 11, 0.4);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center;
    }
    .logo {
      font-size: 38px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      color: #f59e0b;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #f59e0b;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #f59e0b;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background-color: #fbbf24; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .alert-success {
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #86efac;
    }
    .btn-app {
      display: inline-block;
      margin-top: 18px;
      color: #f59e0b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🏆</div>
    <h1>Ranking Chwały</h1>
    <p class="desc">Wprowadź swoje nowe hasło poniżej, aby odzyskać dostęp do konta.</p>

    <div id="errorAlert" class="alert alert-error"></div>
    <div id="successAlert" class="alert alert-success"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="newPassword">Nowe hasło (min. 5 znaków)</label>
        <input type="password" id="newPassword" required minlength="5" placeholder="Wpisz nowe hasło">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Powtórz nowe hasło</label>
        <input type="password" id="confirmPassword" required minlength="5" placeholder="Powtórz nowe hasło">
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Ustaw nowe hasło 🔐</button>
    </form>

    <div id="openAppContainer" style="display: none;">
      <a href="rankingchwaly://open" class="btn-app">🚀 Wróć do aplikacji</a>
    </div>
  </div>

  <script>
    // 1. Podaj swój SUPABASE URL i ANON KEY (z dashboardu Supabase)
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const errorAlert = document.getElementById("errorAlert");
    const successAlert = document.getElementById("successAlert");
    const resetForm = document.getElementById("resetForm");
    const submitBtn = document.getElementById("submitBtn");
    const openAppContainer = document.getElementById("openAppContainer");

    // Sprawdzenie sesji z tokena w URL
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        console.log("Tryb odzyskiwania hasła aktywny");
      }
    });

    async function handleReset(e) {
      e.preventDefault();
      errorAlert.style.display = "none";
      successAlert.style.display = "none";

      const pass = document.getElementById("newPassword").value;
      const confirmPass = document.getElementById("confirmPassword").value;

      if (pass !== confirmPass) {
        showError("Hasła nie są identyczne. Upewnij się, że wpisujesz to samo hasło.");
        return;
      }

      if (pass.length < 5) {
        showError("Hasło musi mieć co najmniej 5 znaków.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Zapisywanie...";

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: pass
        });

        if (error) {
          showError("Błąd: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Ustaw nowe hasło 🔐";
        } else {
          successAlert.innerText = "Twoje hasło zostało pomyślnie zmienione! Możesz teraz zalogować się w aplikacji.";
          successAlert.style.display = "block";
          resetForm.style.display = "none";
          openAppContainer.style.display = "block";
        }
      } catch (err) {
        showError("Wystąpił nieoczekiwany błąd. Spróbuj ponownie.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Ustaw nowe hasło 🔐";
      }
    }

    function showError(msg) {
      errorAlert.innerText = msg;
      errorAlert.style.display = "block";
    }
  </script>
</body>
</html>
